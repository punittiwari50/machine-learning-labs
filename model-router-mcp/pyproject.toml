[build-system]
requires = ["setuptools>=75.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router-mcp"
version = "0.1.0"
description = "Docker-hosted Python MCP router for local model backends."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.9.0",
]

[project.scripts]
model-router-mcp = "model_router_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
